<!DOCTYPE html>
<html>
<head>
    <title>Brain Tumor Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #4d4b4bff;
            color: #fff;
            display: flex;
            flex-direction:column; 
            align-items: center;       
            height: 100vh;
            margin: 10;
            padding-top: 200px;         
        }

        form {
            margin-top: 20px;          
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 50px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
        }
        h2{
            text-align:center;
            margin-bottom:25px;
            font-size:24px;
            letter-spacing:1px;
        }
        input[type='file']{
            background:purple;
            border:1px solid rgba(255,255,255,0.3);
            border-radius:8px;
            padding:10px;
            color:#fff;
            width:100%;
            margin-bottom:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h2>Upload MRI Image</h2>
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>
</body>
</html>
